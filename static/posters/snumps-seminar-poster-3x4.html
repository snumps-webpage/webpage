<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SNUMPS Seminar Poster 3x4</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;700;900&family=STIX+Two+Text:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --latex-bg: #f4f4f4;
        --latex-text: #111111;
        --latex-muted: #4a4a4a;
        --latex-rule: #1a1a1a;
        --latex-accent: #b22222;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #d8d8d8;
        color: var(--latex-text);
        font-family: "Noto Sans KR", "STIX Two Text", sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .stage {
        width: min(100vw, 1080px);
        aspect-ratio: 4 / 5;
      }

      .poster {
        position: relative;
        width: 100%;
        height: 100%;
        background: var(--latex-bg);
        border: 1px solid var(--latex-rule);
        padding: clamp(1.15rem, 2.45vw, 1.8rem);
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        gap: clamp(0.92rem, 1.45vw, 1.2rem);
        overflow: hidden;
      }

      .poster::before {
        content: "";
        position: absolute;
        inset: 12px;
        border: 1px solid color-mix(in srgb, var(--latex-rule) 56%, transparent);
        pointer-events: none;
      }

      .logo-overlay {
        position: absolute;
        right: clamp(1rem, 1.86vw, 1.6rem);
        top: clamp(68%, 72%, 76%);
        width: clamp(208px, 26vw, 276px);
        pointer-events: none;
        z-index: 0;
        opacity: 0.11;
        transform: rotate(-12deg);
      }

      .logo-overlay img {
        width: 100%;
        height: auto;
        object-fit: contain;
        filter: grayscale(8%) contrast(114%) brightness(84%);
      }

      .logo-overlay-secondary {
        position: absolute;
        left: clamp(0.84rem, 1.66vw, 1.3rem);
        top: clamp(80%, 84%, 87%);
        width: clamp(148px, 19vw, 200px);
        pointer-events: none;
        z-index: 0;
        opacity: 0.08;
        transform: rotate(16deg);
      }

      .logo-overlay-secondary img {
        width: 100%;
        height: auto;
        object-fit: contain;
        filter: grayscale(14%) contrast(108%) brightness(88%);
      }

      .paper-symbols {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        color: #666;
        font-family: "STIX Two Text", "Times New Roman", serif;
        font-style: italic;
      }

      .paper-symbol {
        position: absolute;
        opacity: 0.11;
        line-height: 1;
        transform-origin: center;
      }

      .paper-symbol:nth-child(1) {
        right: 13%;
        top: 18%;
        font-size: clamp(5.2rem, 7.4vw, 6.8rem);
        transform: rotate(-12deg);
      }

      .paper-symbol:nth-child(2) {
        left: 11%;
        top: 22%;
        font-size: clamp(4.6rem, 6.2vw, 5.8rem);
        transform: rotate(9deg);
        opacity: 0.085;
      }

      .paper-symbol:nth-child(3) {
        right: 16%;
        top: 47%;
        font-size: clamp(5.8rem, 8.2vw, 7.4rem);
        transform: rotate(-9deg);
        opacity: 0.12;
      }

      .paper-symbol:nth-child(4) {
        left: 14%;
        top: 56%;
        font-size: clamp(5rem, 6.8vw, 6.2rem);
        transform: rotate(11deg);
        opacity: 0.094;
      }

      .paper-symbol:nth-child(5) {
        right: 19%;
        bottom: 19%;
        font-size: clamp(5.4rem, 7vw, 6.6rem);
        transform: rotate(-8deg);
      }

      .paper-symbol:nth-child(6) {
        left: 30%;
        bottom: 10%;
        font-size: clamp(4.8rem, 6.2vw, 5.8rem);
        transform: rotate(10deg);
        opacity: 0.09;
      }

      .rule-thick {
        position: relative;
        z-index: 1;
        height: 0;
        border-top: 2px solid var(--latex-rule);
      }

      .hero {
        position: relative;
        z-index: 1;
        display: grid;
        align-content: center;
        justify-items: center;
        text-align: center;
        gap: clamp(1.26rem, 2vw, 1.8rem);
        padding-inline: clamp(1rem, 2.2vw, 1.9rem);
        padding-top: clamp(6.24rem, 8.8vw, 7.72rem);
        padding-bottom: clamp(1.08rem, 1.72vw, 1.44rem);
      }

      .title {
        margin: 0;
        font-size: clamp(3.62rem, 8.9vw, 5.96rem);
        line-height: 1;
        letter-spacing: -0.012em;
        font-weight: 800;
        word-break: keep-all;
        hyphens: none;
        padding-inline: clamp(0.15rem, 0.5vw, 0.35rem);
        padding-top: clamp(0.18rem, 0.34vw, 0.26rem);
        padding-bottom: clamp(0.34rem, 0.58vw, 0.44rem);
      }

      .title-line {
        display: block;
        white-space: nowrap;
      }

      .title-line + .title-line {
        margin-top: 0.08em;
      }

      .accent {
        color: var(--latex-accent);
      }

      .abstract-panel {
        width: min(91%, 840px);
        border-top: 1px solid var(--latex-rule);
        border-bottom: 1px solid var(--latex-rule);
        padding: clamp(1.34rem, 2.12vw, 1.78rem) 0;
        display: grid;
        gap: 0.24rem;
        justify-items: center;
        margin-top: clamp(2.4rem, 3.8vw, 3.2rem);
      }

      .abstract-body {
        margin: 0;
        width: min(94%, 780px);
        font-size: clamp(2.18rem, 3.35vw, 2.62rem);
        font-weight: 700;
        line-height: 1.36;
      }

      .main {
        position: relative;
        z-index: 1;
        width: min(94%, 940px);
        margin: 0 auto;
        display: flex;
        align-items: flex-end;
        height: 100%;
        align-content: stretch;
        padding-top: clamp(0.72rem, 1.34vw, 1.12rem);
      }

      .left-info {
        border-top: 1px solid color-mix(in srgb, var(--latex-rule) 62%, transparent);
        border-bottom: 1px solid color-mix(in srgb, var(--latex-rule) 62%, transparent);
        padding: clamp(1.68rem, 2.46vw, 2.2rem) clamp(0.74rem, 1.26vw, 1.08rem);
        display: grid;
        height: auto;
        grid-template-rows: auto auto auto auto;
        align-content: start;
        gap: clamp(1rem, 1.42vw, 1.28rem);
        width: 100%;
        margin-top: auto;
      }

      .info-item {
        margin: 0;
        font-size: clamp(1.76rem, 2.58vw, 2.22rem);
        font-weight: 700;
        line-height: 1.24;
      }

      .info-key {
        font-family: "JetBrains Mono", monospace;
        font-size: 0.72em;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--latex-muted);
        margin-right: 0.38rem;
      }

      .speaker {
        margin: 0;
        font-size: clamp(1.58rem, 2.32vw, 1.96rem);
        font-weight: 600;
        color: var(--latex-muted);
        line-height: 1.22;
        align-self: start;
        margin-top: 0.22rem;
      }

      .foot {
        position: relative;
        z-index: 1;
        border-top: 1px solid var(--latex-rule);
        padding-top: 0.82rem;
        display: grid;
        gap: 0.34rem;
      }

      .foot-meta {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 0.7rem;
      }

      .club {
        margin: 0;
        font-size: clamp(1.8rem, 2.64vw, 2.26rem);
        font-weight: 700;
      }

      .handle {
        margin: 0;
        font-family: "JetBrains Mono", monospace;
        font-size: clamp(1.48rem, 2.2vw, 1.88rem);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--latex-muted);
      }

      @media (max-width: 760px) {
        .stage {
          width: 96vw;
        }

        .poster {
          padding: 1rem;
        }

        .title {
          font-size: clamp(3.04rem, 12.8vw, 5rem);
          line-height: 1;
        }

        .abstract-panel {
          width: min(96%, 810px);
          margin-top: 1.68rem;
        }

        .abstract-body {
          width: min(96%, 760px);
          font-size: clamp(1.98rem, 6.12vw, 2.3rem);
        }

        .logo-overlay {
          right: 0.64rem;
          top: 76%;
          width: min(36vw, 212px);
          opacity: 0.12;
        }

        .logo-overlay-secondary {
          left: 0.56rem;
          top: 86%;
          width: min(26vw, 146px);
          opacity: 0.08;
        }

        .paper-symbol:nth-child(1) {
          right: 9%;
          top: 20%;
        }

        .paper-symbol:nth-child(2) {
          left: 8%;
          top: 24%;
        }

        .paper-symbol:nth-child(3) {
          right: 12%;
          top: 50%;
        }

        .paper-symbol:nth-child(4) {
          left: 10%;
          top: 60%;
        }

        .paper-symbol:nth-child(5) {
          right: 14%;
          bottom: 18%;
        }

        .paper-symbol:nth-child(6) {
          left: 24%;
          bottom: 11%;
        }

        .left-info {
          padding: 1.34rem 0.46rem;
          gap: 0.84rem;
        }

        .foot-meta {
          flex-direction: column;
          align-items: start;
          gap: 0.28rem;
        }

        .info-item {
          font-size: clamp(1.56rem, 5.08vw, 1.88rem);
        }

        .speaker {
          font-size: clamp(1.28rem, 4.12vw, 1.56rem);
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <article class="poster">
        <div class="paper-symbols" aria-hidden="true">
          <span class="paper-symbol">∑</span>
          <span class="paper-symbol">∫</span>
          <span class="paper-symbol">∏</span>
          <span class="paper-symbol">∂</span>
          <span class="paper-symbol">∞</span>
          <span class="paper-symbol">λ</span>
        </div>

        <div class="logo-overlay" aria-hidden="true">
          <img src="./favicon.svg" alt="" loading="eager" decoding="async" />
        </div>

        <div class="logo-overlay-secondary" aria-hidden="true">
          <img src="./favicon.svg" alt="" loading="eager" decoding="async" />
        </div>

        <div class="rule-thick"></div>

        <section class="hero">
          <h1 class="title">
            <span class="title-line">수체와 타원곡선을 잇는</span>
            <span class="title-line accent">L-함수</span>
          </h1>

          <section class="abstract-panel">
            <p class="abstract-body">
              Number Field와 Elliptic Curve의 연결을 L-함수의 시각으로 읽으며,
              핵심 아이디어와 직관을 짧고 선명하게 정리합니다.
            </p>
          </section>
        </section>

        <section class="main">
          <aside class="left-info">
            <p class="info-item"><span class="info-key">일시</span>2025.10.01 (수) 18:00</p>
            <p class="info-item"><span class="info-key">장소</span>자연과학대학 25동 105호</p>
            <p class="info-item"><span class="info-key">선수지식</span>대수학 기초 · 복소해석 기초</p>
            <p class="speaker">발표: 서울대 수리과학부 25학번 서성욱</p>
          </aside>
        </section>

        <footer class="foot">
          <div class="foot-meta">
            <p class="club">서울대학교 수학문제연구회</p>
            <p class="handle">@SNU_MPS</p>
          </div>
        </footer>
      </article>
    </main>
  </body>
</html>
